// generates the FAQ menu available from the first run menu or the help menu

faqQuestions = [
  "What is the fastest way to get help/support for Dune Strike?"
  "How do I determine what version of Dune Strike I have installed?"
  "How do I check for updates for Dune Strike?"
  "How do I load my map in coop-edit mode?"
  "How do I enter edit mode?"
  "How do I switch to a different primary weapon?"
  "How do I report an abusive or cheating player?"
  "Where is the licensing information?"
]

faqAnswer_1 = [
  "Open an issue on the Dune Strike GitHub repository and include your"
  "game version, operating system and any relevant logs or screenshots."
  "Please be patient for assistance."
  ""
  "Link:"
  "https://github.com/aminghaseminia/dunestrike/issues - Dune Strike issue tracker"
]

faqAnswer_2 = [
  "Your Dune Strike version can be determined by launching the game and executing"
  "the /version command. It should output a 4 digit number such as 1202 -"
  "this would indicate that you have Dune Strike version 1.2.0.2 installed."
]

faqAnswer_3 = [
  "Using the information that you received from executing the /version command"
  "(see FAQ #2) - compare it with the latest release on the project page."
  ""
  "Link:"
  "https://github.com/aminghaseminia/dunestrike/releases - Dune Strike releases"
]

faqAnswer_4 = [
  "The Cube engine makes it easy for multiple people to make a map at the same"
  "time. This is called coop-edit mode. If you want to make a map in coop-edit"
  "mode use the following steps:"
  ""
  "#1: Use the /newmap command to create a new map."
  "#2: Use the /savemap command to save the map, be sure to give it a unique name."
  "#3: Connect to a server that allows map uploads and coop-edit."
  "#4: Upload the new map to the server by using the /sendmap command."
  "#5: Use the /coop command to load your map in coop-edit mode."
  "#6 Enter edit mode and start mapping. Use the autosavemap feature or use /savemap often."
  ""
  "If you just want to load a existing map on the server in coop-edit mode, see step #5."
]

faqAnswer_5 = [
  "By default, if you are in a singleplayer mode or coop-edit mode, the E key will"
  "toggle you in and out of edit mode. Edit mode allows you to execute map editing"
  "functions and manipulate map geometry. If all else fails, you can always execute"
  "the /edittoggle command to toggle in and out of edit mode."
]

faqAnswer_6 = [
  "By default, the B key will show the primary weapon change menu. If all else fails,"
  "you can always execute /showmenu Weapons - as a command. Note that the W on weapons"
  "is capitalized."
]

faqAnswer_7 = [
  "There is no global blacklist in this distribution. Use the server's"
  "kick and ban commands, and keep demos or screenshots if you need evidence."
  "Servers are run by their own owners, so report abuse to the server admin."
]

faqAnswer_8 = [
  "Dune Strike and its resources are pieced together and developed by various people"
  "throughout the world. While the source code is open source and released under a"
  "license derived from the zlib license, the majority of the media found in the"
  "Dune Strike package are released under different licenses. Please read and"
  "understand the various licenses before modifying or redistributing media within"
  "Dune Strike or the Dune Strike package as a whole."
  ""
  "Link:"
  "https://github.com/aminghaseminia/dunestrike/blob/main/CREDITS.md - Dune Strike licensing and credits"
]

////  Main > Help > FAQ  ////

newmenu faq
loop i (listlen $faqQuestions) [
  menuitem (concatword (at ["\f2" "\fD"] (&b $i 1)) (format [#%1: ] (+ $i 1)) (at $faqQuestions $i)) -1

  tempalias tmpMenuAlias (concatword faqAnswer_ (+ $i 1))
  loop o (listlen $$tmpMenuAlias) [
    if (strstr (at $$tmpMenuAlias $o) "http://") [
      menuitem (concatword "   \f1" (at $$tmpMenuAlias $o)) -1
    ] [
      menuitem (concatword "   \f5" (at $$tmpMenuAlias $o)) -1
    ]
  ]
  delalias $tmpMenuAlias
  menuitem "" -1
]
menuitem "\t\t\t\t\t\f2[ Back ]" [ closecurmenu ]

delalias faqQuestions
