// This file gets executed every time you start AssaultCube.

// This is where you should put any scripts you may have created for AC.

// In-game voice chat (on by default; F9 turns it off):
//   F9  toggles voice chat on/off (you get an on-screen confirmation)
//   X   hold to talk (push-to-talk), release to stop
// If you prefer different keys, change them here or with "bind" in the console.
bind F9 togglevoice
bind X [ voiceon; onrelease voiceoff ]
